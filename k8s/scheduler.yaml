apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
        - name: scheduler
          image: distributed-web-crawler:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "scheduler.main"]
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka:9092
            - name: DATABASE_URL
              value: postgresql://crawler:crawler@postgres:5432/crawler
