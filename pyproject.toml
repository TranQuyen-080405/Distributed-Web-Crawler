[project]
name = "distributed-web-crawler"
version = "0.1.0"
description = "Distributed web crawler with a Kafka frontier and PostgreSQL storage"
readme = "README.md"
authors = [
    { name = "TranQuyen-080405", email = "quyen.bui080405@hcmut.edu.vn" }
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4==4.15.0",
    "confluent-kafka==2.16.0",
    "psycopg[binary]==3.3.6",
    "requests==2.34.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
